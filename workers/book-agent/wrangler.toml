name = "book-agent"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

[observability]
enabled = true

[vars]
# Sonnet 5.5 over retrieved passages (Ted's call, 2026-10-16). Haiku 5.5 is the cheaper fallback.
MODEL = "claude-sonnet-5-5"
# Workers AI account for query embeddings (REST). Token is a secret: CF_AI_TOKEN.
CF_ACCOUNT_ID = "9faaae0334190755634fc54bf3a1517a"

# Per-IP rate limit (config-only, no storage): 10 questions per minute.
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Secrets (wrangler secret put …):
#   ANTHROPIC_API_KEY — dedicated Console workspace key with a monthly spend cap
#   NEON_DATABASE_URL — retrieval store (rag_chunks) + question log (book_questions)
#   CF_AI_TOKEN       — Workers AI token (sops: CLOUDFLARE_AI_TOKEN) for bge-m3 query embeddings
